<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgExamen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="glowVerde" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#bgExamen)" />

  <g transform="translate(190, 45)">
    <!-- Ojo esquemático optométrico -->
    <path d="M 0,80 Q 110,0 220,80 Q 110,160 0,80 Z" fill="rgba(255,255,255,0.08)" stroke="#34d399" stroke-width="5" />
    <circle cx="110" cy="80" r="42" fill="#047857" stroke="#6ee7b7" stroke-width="4" />
    <circle cx="110" cy="80" r="20" fill="#022c22" />
    <circle cx="120" cy="72" r="7" fill="#ffffff" />
    
    <!-- Retícula de precisión -->
    <line x1="110" y1="20" x2="110" y2="45" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <line x1="110" y1="115" x2="110" y2="140" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <line x1="50" y1="80" x2="75" y2="80" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <line x1="145" y1="80" x2="170" y2="80" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Textos de examen -->
  <text x="300" y="245" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
    EXAMEN VISUAL COMPUTARIZADO
  </text>
  <text x="300" y="278" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#6ee7b7" font-weight="600" text-anchor="middle">
    Tu Visión Óptica · Agenda tu Consulta Anual Especializada
  </text>
</svg>
