<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLentes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="gotaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#bgLentes)" />

  <g transform="translate(225, 45)">
    <!-- Curva de lente de contacto -->
    <path d="M 10,85 C 30,140 120,140 140,85" stroke="#a5b4fc" stroke-width="7" fill="rgba(129, 140, 248, 0.2)" stroke-linecap="round" />
    <path d="M 25,82 C 45,120 105,120 125,82" stroke="rgba(255,255,255,0.6)" stroke-width="3" fill="none" stroke-linecap="round" />
    
    <!-- Gota de hidratación -->
    <path d="M 75,10 C 60,35 50,55 50,70 A 25,25 0 0,0 100,70 C 100,55 90,35 75,10 Z" fill="url(#gotaGrad)" />
    <ellipse cx="68" cy="62" rx="4" ry="7" fill="rgba(255,255,255,0.7)" transform="rotate(-20 68 62)" />
  </g>

  <!-- Textos de lentes de contacto -->
  <text x="300" y="245" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
    LENTES DE CONTACTO Y SOLUCIONES
  </text>
  <text x="300" y="278" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#a5b4fc" font-weight="600" text-anchor="middle">
    Tu Visión Óptica · Hidratación, Comodidad y Oxigenación
  </text>
</svg>
